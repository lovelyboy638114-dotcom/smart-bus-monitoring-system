server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Reverse proxy API Gateway endpoints directly to backend
    location /api/ {
        proxy_pass https://safebus-backend-production-dd43.up.railway.app/api/;
        proxy_set_header Host safebus-backend-production-dd43.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cv/ {
        proxy_pass https://safebus-backend-production-dd43.up.railway.app/cv/;
        proxy_set_header Host safebus-backend-production-dd43.up.railway.app;
        proxy_ssl_server_name on;
    }

    location /ws {
        proxy_pass https://safebus-backend-production-dd43.up.railway.app/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host safebus-backend-production-dd43.up.railway.app;
        proxy_ssl_server_name on;
    }

    # Support single page application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
