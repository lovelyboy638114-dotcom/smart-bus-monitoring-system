server:
  port: ${PORT:8080}

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:*}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # Root Route: Redirect to Frontend Public Application (Eliminates 404)
        - id: root-redirect
          uri: ${FRONTEND_PUBLIC_URL:https://safebus-frontend-production.up.railway.app}
          predicates:
            - Path=/
          filters:
            - RedirectTo=302, ${FRONTEND_PUBLIC_URL:https://safebus-frontend-production.up.railway.app}

        # Auth Service Route
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/api/v1/auth/**
        
        # Student Service Route (includes student, storage, sos, analytics, and admin)
        - id: student-service
          uri: ${STUDENT_SERVICE_URI:http://127.0.0.1:8082}
          predicates:
            - Path=/api/v1/students/**, /api/v1/student/**, /api/v1/storage/**, /api/v1/sos/**, /api/v1/analytics/**, /api/v1/admin/**, /uploads/**
        
        # Transport Service Route
        - id: transport-service
          uri: ${TRANSPORT_SERVICE_URI:http://127.0.0.1:8083}
          predicates:
            - Path=/api/v1/buses/**, /api/v1/routes/**, /api/v1/telemetry/**, /api/v1/assignments/**, /api/v1/driver/**
        
        # Attendance Service Route
        - id: attendance-service
          uri: ${ATTENDANCE_SERVICE_URI:http://127.0.0.1:8083}
          predicates:
            - Path=/api/v1/attendance/**

        # Notification Service Route
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://127.0.0.1:8083}
          predicates:
            - Path=/api/v1/notifications/**

        # Python Edge AI Computer Vision Route
        - id: cv-service
          uri: ${CV_SERVICE_URI:http://127.0.0.1:5001}
          predicates:
            - Path=/cv/**
          filters:
            - StripPrefix=1

        # WebSocket Route
        - id: websocket-route
          uri: ${WS_SERVICE_URI:ws://127.0.0.1:8083}
          predicates:
            - Path=/ws/**


# Disable heavyweight SpringDoc reflection to avoid OOM and route collisions
# MergedOpenApiController directly serves static OpenAPI 3.0 specs and standalone Swagger UI
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
