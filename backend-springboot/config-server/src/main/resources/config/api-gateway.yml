server:
  port: ${PORT:8080}

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:*}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # Auth Service Route
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        
        # Student Service Route (includes student, storage, sos, analytics, and admin)
        - id: student-service
          uri: ${STUDENT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/students/**, /api/v1/student/**, /api/v1/storage/**, /api/v1/sos/**, /api/v1/analytics/**, /api/v1/admin/**, /uploads/**
        
        # Transport Service Route (includes buses, routes, telemetry, and assignments)
        - id: transport-service
          uri: ${TRANSPORT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/buses/**, /api/v1/routes/**, /api/v1/telemetry/**, /api/v1/assignments/**, /api/v1/driver/**
        
        # Attendance Service Route
        - id: attendance-service
          uri: ${ATTENDANCE_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/attendance/**

        # Notification Service Route
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/notifications/**

        # Python Edge AI Computer Vision Route
        - id: cv-service
          uri: ${CV_SERVICE_URI:http://localhost:5001}
          predicates:
            - Path=/cv/**
          filters:
            - StripPrefix=1

        # WebSocket Route
        - id: websocket-route
          uri: ${WS_SERVICE_URI:ws://localhost:8086}
          predicates:
            - Path=/ws/**


        # OpenAPI Doc routes mapping
        - id: auth-openapi
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs
        - id: student-openapi
          uri: lb://student-service
          predicates:
            - Path=/v3/api-docs/student
          filters:
            - SetPath=/v3/api-docs
        - id: transport-openapi
          uri: lb://transport-service
          predicates:
            - Path=/v3/api-docs/transport
          filters:
            - SetPath=/v3/api-docs
        - id: attendance-openapi
          uri: lb://attendance-service
          predicates:
            - Path=/v3/api-docs/attendance
          filters:
            - SetPath=/v3/api-docs
        - id: notification-openapi
          uri: lb://notification-service
          predicates:
            - Path=/v3/api-docs/notification
          filters:
            - SetPath=/v3/api-docs

# Global Swagger Enabled by Default (Local/Dev)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    urls:
      - name: "1. 🌟 ALL Services (Unified Complete API)"
        url: /v3/api-docs/all
      - name: "2. Auth Service"
        url: /v3/api-docs/auth
      - name: "3. Student Service"
        url: /v3/api-docs/student
      - name: "4. Transport Service"
        url: /v3/api-docs/transport
      - name: "5. Attendance Service"
        url: /v3/api-docs/attendance
      - name: "6. Notification Service"
        url: /v3/api-docs/notification

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
