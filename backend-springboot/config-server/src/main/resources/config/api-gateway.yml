server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # Auth Service Route
        - id: auth-service
          uri: lb://safebus-auth-service
          predicates:
            - Path=/api/v1/auth/**
        
        # Student Service Route (includes student, storage, sos, and analytics)
        - id: student-service
          uri: lb://safebus-student-service
          predicates:
            - Path=/api/v1/students/**, /api/v1/storage/**, /api/v1/sos/**, /api/v1/analytics/**
        
        # Transport Service Route (includes buses, routes, telemetry, and assignments)
        - id: transport-service
          uri: lb://safebus-transport-service
          predicates:
            - Path=/api/v1/buses/**, /api/v1/routes/**, /api/v1/telemetry/**, /api/v1/assignments/**
        
        # Attendance Service Route
        - id: attendance-service
          uri: lb://safebus-attendance-service
          predicates:
            - Path=/api/v1/attendance/**

        # Notification Service Route
        - id: notification-service
          uri: lb://safebus-notification-service
          predicates:
            - Path=/api/v1/notifications/**
